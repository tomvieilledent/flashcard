server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Mêmes en-têtes de sécurité que le VPS (SSOT :
    # deploy/nginx/vlldnt-security-headers.conf, copié dans l'image par le
    # Dockerfile). À `include` dans CHAQUE `location` qui déclare un
    # `add_header` : nginx cesse d'hériter des `add_header` parents dès qu'un
    # `location` en ajoute un.
    include /etc/nginx/snippets/vlldnt-security-headers.conf;

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        include /etc/nginx/snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA : toute route inconnue retombe sur index.html.
    location / {
        include /etc/nginx/snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
