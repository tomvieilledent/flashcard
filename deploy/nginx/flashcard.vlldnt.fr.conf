# /etc/nginx/sites-available/flashcard.vlldnt.fr.conf
# Vhost du sous-domaine (HTTPS). Le certificat est mutualisé avec l'apex
# (lignée `vlldnt.fr`, étendue via `certbot --expand -d flashcard.vlldnt.fr`).
# Référence versionnée (SSOT). Voir docs/deployment.md.

# --- HTTP : renouvellement ACME + redirection vers HTTPS -------------------
server {
    listen 80;
    listen [::]:80;
    server_name flashcard.vlldnt.fr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://flashcard.vlldnt.fr$request_uri;
    }
}

# --- HTTPS : le site ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flashcard.vlldnt.fr;
    server_tokens off;

    root /var/www/flashcard.vlldnt.fr;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/vlldnt.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlldnt.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Pas d'agrafage OCSP : Let's Encrypt n'inclut plus d'URL OCSP dans ses
    # certificats (OCSP en fin de vie, bascule vers les CRL).

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité — à RÉPÉTER dans chaque `location` qui déclare un
    # `add_header` : nginx cesse d'hériter des `add_header` parents dès qu'un
    # `location` en ajoute un. Centralisés dans un snippet.
    include snippets/vlldnt-security-headers.conf;

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        include snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA : toute route retombe sur index.html.
    location / {
        include snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
