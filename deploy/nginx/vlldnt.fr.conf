# /etc/nginx/sites-available/vlldnt.fr.conf
# Vhost final (HTTPS). Écrit tel quel par scripts/vps-setup.sh une fois le
# certificat Let's Encrypt obtenu. Référence versionnée (SSOT).

# --- HTTP : renouvellement ACME + redirection vers HTTPS -------------------
server {
    listen 80;
    listen [::]:80;
    server_name vlldnt.fr www.vlldnt.fr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://vlldnt.fr$request_uri;
    }
}

# --- HTTPS : www -> apex --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vlldnt.fr;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/vlldnt.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlldnt.fr/privkey.pem;

    return 301 https://vlldnt.fr$request_uri;
}

# --- HTTPS : le site ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vlldnt.fr;
    server_tokens off;

    root /var/www/vlldnt.fr;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/vlldnt.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vlldnt.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Agrafage OCSP : évite au client une requête vers l'AC (perf + vie privée).
    # Échoue en douceur si le resolver est absent (aucune coupure).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité — À RÉPÉTER dans chaque bloc `location` qui déclare
    # un `add_header` : dès qu'un `location` ajoute un en-tête, nginx cesse
    # d'hériter de ceux du bloc `server`. On les centralise dans un snippet.
    include snippets/vlldnt-security-headers.conf;

    # Assets fingerprintés par Vite : cache long et immuable.
    location /assets/ {
        include snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA : toute route retombe sur index.html.
    location / {
        include snippets/vlldnt-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
