# /etc/nginx/snippets/vlldnt-security-headers.conf
# En-têtes de sécurité communs. `include` dans le bloc server ET dans chaque
# bloc location qui déclare son propre add_header (nginx n'hérite plus des
# add_header parents dès qu'un location en ajoute un).
# Référence versionnée (SSOT) — écrit tel quel par scripts/vps-setup.sh.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
# script-src : 'self' + hash du <script> inline d'index.html (bootstrap de thème,
# anti-flash avant le premier rendu). Recalculer le hash s'il change :
#   node -e 'const c=require("crypto"),f=require("fs");const m=f.readFileSync("dist/index.html","utf8").match(/<script>([\s\S]*?)<\/script>/);console.log("sha256-"+c.createHash("sha256").update(m[1]).digest("base64"))'
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-rc8oRlSkpzS65XHTf/ScPm0RzBk0KNZMHtDCcUOOmzc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
