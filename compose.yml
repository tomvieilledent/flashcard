# Runtime `compose` de l'orchestrateur vlldnt (portfolio/scripts/deploy-project.sh).
# Port du service web exposé UNIQUEMENT en loopback ; nginx (VPS) fait le proxy
# + pose les en-têtes de sécurité/CSP (portfolio/deploy/nginx/app.compose.tmpl).
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8084}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
